limit_req_zone $binary_remote_addr zone=analytics:10m rate=2r/s;
# HTTPS is terminated by the existing reverse proxy. Keep local port 9001 usable.
server {
    listen 80;
    listen [::]:80;
    server_name nxflo.com;
    return 301 https://www.nxflo.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.nxflo.com localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location = /index.html {
        return 301 /$is_args$args;
    }

    # Serve the home file directly: an internal index redirect would otherwise
    # hit the public /index.html redirect and loop back to /.
    location = / {
        try_files /index.html =404;
    }

    location = /admin { return 302 /admin.html; }
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /bms_integration_hub/api/analytics/collect {
        limit_req zone=analytics burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://nxflo-portal-api:8000;
        proxy_set_header Host $host;
    }

    # Dedicated customer portal: standalone login, excluded from search indexes.
    # Do not disallow crawling in robots.txt: crawlers must read the noindex rule.
    location = /bms_integration_hub {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /bms_integration_hub/index.html =404;
    }

    location ^~ /bms_integration_hub/api/admin/generator {
        client_max_body_size 32m;
        proxy_pass http://nxflo-portal-api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location ^~ /bms_integration_hub/api/ {
        client_max_body_size 16k;
        proxy_pass http://nxflo-portal-api:8000;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /bms_integration_hub/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
