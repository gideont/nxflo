# HTTPS is terminated by the existing reverse proxy. Keep local port 9001 usable.
server {
    listen 80;
    listen [::]:80;
    server_name nxflo.com;
    return 301 https://www.nxflo.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.nxflo.com localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location = /index.html {
        return 301 /$is_args$args;
    }

    # Serve the home file directly: an internal index redirect would otherwise
    # hit the public /index.html redirect and loop back to /.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
